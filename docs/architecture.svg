<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Team 10 — QoS Traffic Management System</title>
<desc id="desc">H1 and H2 send UDP logs, H3 generates iperf3 background traffic, and Open vSwitch S1 forwards traffic to H4 over a 2 Mbps bottleneck. The OS-Ken controller manages S1 using OpenFlow 1.3.</desc>
